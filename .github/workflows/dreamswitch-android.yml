name: DreamSwitch Android - Build APK

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Citron Neo branch, tag or commit (verified default)
        required: false
        default: 7dc47bab8469fabf810fccf88f938f4e75fe3852

permissions:
  contents: read

concurrency:
  group: dreamswitch-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-arm64:
    name: Build DreamSwitch Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      VCPKG_DISABLE_METRICS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"
    steps:
      - name: Checkout DreamSwitch build kit
        uses: actions/checkout@v4
        with:
          path: dreamswitch

      - name: Checkout emulator core and submodules
        uses: actions/checkout@v4
        with:
          repository: citron-neo/emulator
          ref: ${{ inputs.upstream_ref || '7dc47bab8469fabf810fccf88f938f4e75fe3852' }}
          path: emulator
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake ninja-build pkg-config \
            glslang-tools nasm yasm autoconf automake libtool bison flex \
            perl python3 zip unzip curl libvulkan-dev
          echo "VCPKG_DISABLE_METRICS=1" >> "$GITHUB_ENV"

      - name: Android SDK manager
        uses: android-actions/setup-android@v3

      - name: Install SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Test patch logic
        run: python3 -m unittest discover -s dreamswitch/tests -v

      - name: Apply DreamSwitch modifications
        run: python3 dreamswitch/apply_dreamswitch.py emulator

      - name: Verify DreamSwitch Android identifier and interface
        run: |
          grep -F 'applicationId = "org.dreamswitch.emulator"' emulator/src/android/app/build.gradle.kts
          grep -F 'DreamWaveProgressBar' emulator/src/android/app/src/main/res/layout/dialog_progress_bar.xml
          test -f emulator/src/android/app/src/main/java/org/citron/citron_emu/ui/widgets/DreamWaveProgressBar.kt

      - name: Build native core and signed installable APK
        working-directory: emulator/src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleMainlineRelease --no-daemon --stacktrace --max-workers=2

      - name: Validate APK contents and calculate SHA-256
        run: python3 dreamswitch/scripts/check_apk.py emulator/src/android/app/build/outputs/apk/mainline/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamSwitch-Android-arm64-signed
          path: emulator/src/android/app/build/outputs/apk/mainline/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DreamSwitch-build-diagnostics
          path: |
            emulator/src/android/app/build/reports/**
            emulator/src/android/app/.cxx/**/build_command.txt
          if-no-files-found: ignore
